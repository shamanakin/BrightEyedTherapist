<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscribe - Bright Eyed Therapist</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="auth.js"></script>
</head>
<body>

    <header class="container">
        <nav>
            <a href="index.html" class="nav-logo">
                <i class="fa-solid fa-leaf" style="color: var(--col-accent);"></i>
                Bright Eyed Therapist
            </a>
        </nav>
    </header>

    <main class="container" style="padding-top: 4rem; padding-bottom: 4rem; flex-grow: 1; display: flex; align-items: center; justify-content: center;">
        <div style="width: 100%; max-width: 500px;">
            <div class="card" style="padding: 2.5rem;">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <span class="badge" style="font-size: 0.9rem; margin-bottom: 1rem;">Early Access Offer</span>
                    <h2 style="margin-bottom: 0.5rem;">Upgrade to Premium</h2>
                    <p style="color: var(--col-text-muted);">Unlock full access to all clinical tools.</p>
                </div>

                <div style="background: #F9FAFB; padding: 1.5rem; border-radius: 8px; border: 1px solid #E5E7EB; margin-bottom: 2rem; text-align: center;">
                    <div style="font-family: 'Playfair Display', serif; font-size: 2.5rem; font-weight: 700; color: var(--col-primary);">
                        $10<span style="font-size: 1rem; font-family: 'Inter', sans-serif; color: var(--col-text-muted); font-weight: 400;">/month</span>
                    </div>
                    <p style="font-size: 0.9rem; color: var(--col-text-muted); margin-top: 0.5rem;">Recurring billing. Cancel anytime.</p>
                </div>
                
                <form id="payment-form">
                    <div class="form-group">
                        <label class="form-label">Cardholder Name</label>
                        <input type="text" class="form-input" placeholder="Jane Doe" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Card Number</label>
                        <div style="position: relative;">
                            <input type="text" class="form-input" placeholder="0000 0000 0000 0000" required>
                            <i class="fa-regular fa-credit-card" style="position: absolute; right: 12px; top: 12px; color: #9CA3AF;"></i>
                        </div>
                    </div>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
                        <div class="form-group">
                            <label class="form-label">Expiry</label>
                            <input type="text" class="form-input" placeholder="MM/YY" required>
                        </div>
                        <div class="form-group">
                            <label class="form-label">CVC</label>
                            <input type="text" class="form-input" placeholder="123" required>
                        </div>
                    </div>
                    
                    <button type="submit" class="btn" style="width: 100%; margin-top: 1rem;">
                        <i class="fa-solid fa-lock" style="margin-right: 8px;"></i> Pay Securely
                    </button>
                </form>
                
                <div style="margin-top: 1.5rem; text-align: center;">
                    <p style="font-size: 0.8rem; color: #9CA3AF;">
                        <i class="fa-solid fa-shield-halved"></i> Payments processed securely. This is a demo form.
                    </p>
                </div>
            </div>
            
            <div style="text-align: center; margin-top: 1rem;">
                <a href="dashboard.html" style="color: var(--col-text-muted); text-decoration: none; font-size: 0.9rem;">Cancel and return to Dashboard</a>
            </div>
        </div>
    </main>

    <script>
        const form = document.getElementById('payment-form');
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            
            // Simulate processing delay
            const btn = form.querySelector('button');
            const originalText = btn.innerHTML;
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Processing...';
            
            setTimeout(() => {
                // Update mock auth state
                const success = Auth.subscribe();
                if (success) {
                    alert('Subscription successful! Thank you for supporting Bright Eyed Therapist.');
                    window.location.href = 'dashboard.html';
                } else {
                    alert('Error: Could not find user session. Please log in again.');
                    window.location.href = 'login.html';
                }
            }, 1500);
        });
    </script>

</body>
</html>
